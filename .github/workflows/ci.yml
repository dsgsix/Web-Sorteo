name: Validar Sortea

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run build
      - name: Probar flujos en Chrome
        run: npm run test:browser
        env:
          BROWSER_PATH: /usr/bin/google-chrome
          BROWSER_TEST_DIST: '1'
